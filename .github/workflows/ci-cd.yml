name: Deploy Ionic App Locally

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Ionic image
        shell: cmd
        run: docker build -t ionic-firestore-crud:latest .

      - name: Remove previous container
        shell: cmd
        run: docker rm -f ionic-firestore-crud-container
        continue-on-error: true

      - name: Start updated container
        shell: cmd
        run: docker run -d --name ionic-firestore-crud-container --restart unless-stopped -p 8100:8100 ionic-firestore-crud:latest

      - name: Verify app
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest http://localhost:8100/ -UseBasicParsing -TimeoutSec 2 | Out-Null
              $success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            docker logs ionic-crud
            exit 1
          }